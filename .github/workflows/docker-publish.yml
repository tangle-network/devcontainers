name: Build and Publish Docker Images

on:
  push:
    branches: [main]
    paths:
      - 'base/**'
      - 'intermediate/**'
      - 'infra/**'
      - '.github/workflows/docker-publish.yml'
  schedule:
    # Daily rebuild to pick up upstream base image updates
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      layer:
        description: 'Layer to build (all builds everything)'
        default: 'all'
        type: choice
        options:
          - all
          - base
          - intermediate
          - infra
      image:
        description: 'Specific image name (optional, leave empty for all in layer)'
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/devcontainers

jobs:
  # ============================================
  # GENERATE DYNAMIC MATRIX FROM DOCKERFILES
  # ============================================
  generate-matrix:
    runs-on: ubuntu-latest
    outputs:
      infra-base: ${{ steps.matrix.outputs.infra-base }}
      infra-rust: ${{ steps.matrix.outputs.infra-rust }}
      infra-go: ${{ steps.matrix.outputs.infra-go }}
      infra-foundry: ${{ steps.matrix.outputs.infra-foundry }}
      infra-scientific-python: ${{ steps.matrix.outputs.infra-scientific-python }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate matrices from infra Dockerfiles
        id: matrix
        run: |
          # For each infra Dockerfile, read the final FROM line and group by base image
          declare -A groups
          for df in infra/*.Dockerfile; do
            name=$(basename "$df" .Dockerfile)
            base=$(grep "^FROM" "$df" | tail -1 | awk '{print $2}' | cut -d: -f1)
            case "$base" in
              base-system)        key="infra-base" ;;
              rust)               key="infra-rust" ;;
              go)                 key="infra-go" ;;
              foundry)            key="infra-foundry" ;;
              scientific-python)  key="infra-scientific-python" ;;
              *) echo "WARNING: Unknown base '$base' in $df, skipping"; continue ;;
            esac
            groups[$key]="${groups[$key]:+${groups[$key]},}\"$name\""
          done
          # Output each group as a JSON array
          for key in infra-base infra-rust infra-go infra-foundry infra-scientific-python; do
            if [ -n "${groups[$key]}" ]; then
              echo "${key}=[${groups[$key]}]" >> "$GITHUB_OUTPUT"
            else
              echo "${key}=[]" >> "$GITHUB_OUTPUT"
            fi
          done

  # ============================================
  # BASE LAYER
  # ============================================
  build-base:
    if: github.event_name == 'push' || github.event_name == 'schedule' || inputs.layer == 'all' || inputs.layer == 'base'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push base-system
        uses: docker/build-push-action@v6
        with:
          context: .
          file: base/base-system.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/base-system:latest
            ${{ env.IMAGE_PREFIX }}/base-system:${{ github.sha }}
          cache-from: type=gha,scope=base-system
          cache-to: type=gha,mode=max,scope=base-system

      - name: Make package public
        run: |
          gh api --method PUT /orgs/${{ github.repository_owner }}/packages/container/devcontainers%2Fbase-system/visibility \
            -f visibility=public || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ============================================
  # INTERMEDIATE LAYERS (depend on base)
  # ============================================
  build-intermediate:
    if: github.event_name == 'push' || github.event_name == 'schedule' || inputs.layer == 'all' || inputs.layer == 'intermediate'
    needs: build-base
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: [rust, go, scientific-python]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: intermediate/${{ matrix.image }}.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}:latest
            ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          build-contexts: |
            base-system:latest=docker-image://${{ env.IMAGE_PREFIX }}/base-system:${{ github.sha }}

      - name: Make package public
        run: |
          gh api --method PUT /orgs/${{ github.repository_owner }}/packages/container/devcontainers%2F${{ matrix.image }}/visibility \
            -f visibility=public || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Foundry intermediate (depends on rust)
  build-foundry-intermediate:
    if: github.event_name == 'push' || github.event_name == 'schedule' || inputs.layer == 'all' || inputs.layer == 'intermediate'
    needs: build-intermediate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push foundry intermediate
        uses: docker/build-push-action@v6
        with:
          context: .
          file: intermediate/foundry.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/foundry:latest
            ${{ env.IMAGE_PREFIX }}/foundry:${{ github.sha }}
          cache-from: type=gha,scope=foundry-intermediate
          cache-to: type=gha,mode=max,scope=foundry-intermediate
          build-contexts: |
            rust:latest=docker-image://${{ env.IMAGE_PREFIX }}/rust:${{ github.sha }}

      - name: Make package public
        run: |
          gh api --method PUT /orgs/${{ github.repository_owner }}/packages/container/devcontainers%2Ffoundry/visibility \
            -f visibility=public || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ============================================
  # INFRASTRUCTURE LAYERS (dynamic matrices)
  # ============================================

  # Base-system dependent infra
  build-infra-base:
    if: (github.event_name == 'push' || github.event_name == 'schedule' || inputs.layer == 'all' || inputs.layer == 'infra') && needs.generate-matrix.outputs.infra-base != '[]'
    needs: [generate-matrix, build-base]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJson(needs.generate-matrix.outputs.infra-base) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/${{ matrix.image }}.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}:latest
            ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          build-contexts: |
            base-system:latest=docker-image://${{ env.IMAGE_PREFIX }}/base-system:${{ github.sha }}

      - name: Make package public
        run: |
          gh api --method PUT /orgs/${{ github.repository_owner }}/packages/container/devcontainers%2F${{ matrix.image }}/visibility \
            -f visibility=public || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Rust dependent infra
  build-infra-rust:
    if: (github.event_name == 'push' || github.event_name == 'schedule' || inputs.layer == 'all' || inputs.layer == 'infra') && needs.generate-matrix.outputs.infra-rust != '[]'
    needs: [generate-matrix, build-intermediate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJson(needs.generate-matrix.outputs.infra-rust) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/${{ matrix.image }}.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}:latest
            ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          build-contexts: |
            rust:latest=docker-image://${{ env.IMAGE_PREFIX }}/rust:${{ github.sha }}

      - name: Make package public
        run: |
          gh api --method PUT /orgs/${{ github.repository_owner }}/packages/container/devcontainers%2F${{ matrix.image }}/visibility \
            -f visibility=public || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Go dependent infra
  build-infra-go:
    if: (github.event_name == 'push' || github.event_name == 'schedule' || inputs.layer == 'all' || inputs.layer == 'infra') && needs.generate-matrix.outputs.infra-go != '[]'
    needs: [generate-matrix, build-intermediate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJson(needs.generate-matrix.outputs.infra-go) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/${{ matrix.image }}.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}:latest
            ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          build-contexts: |
            go:latest=docker-image://${{ env.IMAGE_PREFIX }}/go:${{ github.sha }}

      - name: Make package public
        run: |
          gh api --method PUT /orgs/${{ github.repository_owner }}/packages/container/devcontainers%2F${{ matrix.image }}/visibility \
            -f visibility=public || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Foundry dependent infra (EVM chains)
  build-infra-foundry:
    if: (github.event_name == 'push' || github.event_name == 'schedule' || inputs.layer == 'all' || inputs.layer == 'infra') && needs.generate-matrix.outputs.infra-foundry != '[]'
    needs: [generate-matrix, build-foundry-intermediate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJson(needs.generate-matrix.outputs.infra-foundry) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/${{ matrix.image }}.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}:latest
            ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          build-contexts: |
            foundry:latest=docker-image://${{ env.IMAGE_PREFIX }}/foundry:${{ github.sha }}

      - name: Make package public
        run: |
          gh api --method PUT /orgs/${{ github.repository_owner }}/packages/container/devcontainers%2F${{ matrix.image }}/visibility \
            -f visibility=public || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Scientific Python dependent infra (CPU AI/ML)
  build-infra-scientific-python:
    if: (github.event_name == 'push' || github.event_name == 'schedule' || inputs.layer == 'all' || inputs.layer == 'infra') && needs.generate-matrix.outputs.infra-scientific-python != '[]'
    needs: [generate-matrix, build-intermediate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJson(needs.generate-matrix.outputs.infra-scientific-python) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/${{ matrix.image }}.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}:latest
            ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          build-contexts: |
            scientific-python:latest=docker-image://${{ env.IMAGE_PREFIX }}/scientific-python:${{ github.sha }}

      - name: Make package public
        run: |
          gh api --method PUT /orgs/${{ github.repository_owner }}/packages/container/devcontainers%2F${{ matrix.image }}/visibility \
            -f visibility=public || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ============================================
  # NOTIFY ORCHESTRATOR OF IMAGE UPDATES
  # ============================================
  notify-orchestrator:
    if: always() && !cancelled()
    needs:
      - build-infra-base
      - build-infra-rust
      - build-infra-go
      - build-infra-foundry
      - build-infra-scientific-python
    runs-on: ubuntu-latest
    steps:
      - name: Check if any build succeeded
        id: check
        run: |
          # Only notify if at least one build job succeeded
          results=("${{ needs.build-infra-base.result }}" \
                   "${{ needs.build-infra-rust.result }}" \
                   "${{ needs.build-infra-go.result }}" \
                   "${{ needs.build-infra-foundry.result }}" \
                   "${{ needs.build-infra-scientific-python.result }}")
          for r in "${results[@]}"; do
            if [ "$r" = "success" ]; then
              echo "should_notify=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "should_notify=false" >> "$GITHUB_OUTPUT"

      - name: Notify orchestrator of catalog update
        if: steps.check.outputs.should_notify == 'true'
        env:
          ORCHESTRATOR_ADMIN_URL: ${{ secrets.ORCHESTRATOR_ADMIN_URL }}
          ORCHESTRATOR_ADMIN_API_KEY: ${{ secrets.ORCHESTRATOR_ADMIN_API_KEY }}
        run: |
          if [ -z "$ORCHESTRATOR_ADMIN_URL" ] || [ -z "$ORCHESTRATOR_ADMIN_API_KEY" ]; then
            echo "::warning::Orchestrator secrets not configured, skipping catalog notification"
            exit 0
          fi
          curl -sf --max-time 30 -X POST \
            "${ORCHESTRATOR_ADMIN_URL}/catalog/notify-update" \
            -H "Authorization: Bearer ${ORCHESTRATOR_ADMIN_API_KEY}" \
            -H "Content-Type: application/json" \
            -d '{}'
